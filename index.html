<html lang="it">
<head>
<meta charset="utf-8">

<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;max-width:100vw}
body{touch-action:manipulation;overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
.wrap,.card,.grid>*,.fld{min-width:0}
.top{padding-top:calc(12px + env(safe-area-inset-top))!important;padding-left:calc(14px + env(safe-area-inset-left))!important;padding-right:calc(14px + env(safe-area-inset-right))!important}
.wrap{padding-bottom:calc(90px + env(safe-area-inset-bottom))}

input,select,textarea,button{font-size:16px}
.sub,.note{overflow-wrap:anywhere}
body{min-height:100vh}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;font-weight:600;margin:0}
h1 em,h2 em{color:var(--gold);font-style:italic}
button{font:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 14px 90px}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(115deg,var(--bord) 0,var(--bord2) 28%,var(--bg2) 28.2%);border-bottom:1px solid var(--line);padding:12px 14px}
.top .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px}
.top h1{font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.lbl:before,.lbl:after{content:"";height:1px;background:var(--gold);opacity:.45;flex:1}
.lbl:before{max-width:24px}
.btn{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:linear-gradient(135deg,var(--bord),var(--bord2));border-color:var(--gold);color:#fff;font-weight:600}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.ghost{border-color:transparent;color:var(--mut)}

.ico{width:36px;height:36px;padding:0;display:inline-grid;place-items:center;border-radius:50%}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card.gold{border-color:rgba(201,162,107,.55)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.kpi .v{font-family:"Playfair Display",serif;font-size:22px;color:var(--gold2)}
.kpi .k{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
input,select,textarea{width:100%;background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 11px;font:inherit;font-size:16px;max-width:100%}

textarea{min-height:70px;resize:vertical}
input[type=date]{color-scheme:dark}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.fld.wide{grid-column:1/-1}

.list .it{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}

.av{width:40px;height:40px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-family:"Playfair Display",serif;flex:none}

.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:8px 0 4px}

.sum span{font-size:11.5px;color:var(--mut)}
.bar{height:8px;background:var(--bg2);border-radius:6px;overflow:hidden;margin:3px 0 9px}

.opp:last-child{border-bottom:0}
.opp input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--bord2)}
.opp b{display:block}

.status{font-size:12px;color:var(--mut);white-space:nowrap}
.status.ok{color:var(--ok)}.status.w{color:var(--warn)}.status.b{color:var(--bad)}
.lock{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 0 0,rgba(200,16,46,.35),transparent 45%),var(--bg)}
.lock .card{width:100%;max-width:400px;padding:26px}
.lock h1{font-size:30px;margin:8px 0 6px}
.note{font-size:13px;color:var(--mut)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.banner{background:#3a2a12;border:1px solid #6b4c1f;color:#f2d3a0;border-radius:10px;padding:9px 12px;font-size:13px;margin-top:12px}
.banner.b{background:#3a1a1e;border-color:#7d2a33;color:#ffc2c9}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:50;padding:18px}
.modal .card{max-width:420px;width:100%;max-height:92vh;overflow:auto}
.modal .card.vb{max-width:600px}
.chg{font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.chg:last-child{border-bottom:0}
.chg b{color:var(--gold2);font-weight:600}
.btn svg{vertical-align:-3px}
.agenda .a{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.agenda .a:last-child{border-bottom:0}
.dt{font-size:12px;color:var(--gold);min-width:78px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--card);border:1px solid var(--gold);border-radius:999px;padding:9px 16px;font-size:14px;z-index:60}
.formula{font-size:13px;color:var(--mut);margin-top:6px}
@media(max-width:600px){.top h1{font-size:18px}.hide-m{display:none}}
</style>

<script>
"use strict";
/* ================== Configurazione campi ================== */
const CATS=['Liquidità','Titoli e fondi','Gestioni patrimoniali','Polizze di investimento','Previdenza complementare','Immobili','Partecipazioni','Beni di valore','Altro'];
const COPS=['TCM / Caso morte','Infortuni','Invalidità permanente da malattia','Long Term Care','Salute / rimborso spese','CPI su mutuo','Casa / incendio','RC capofamiglia','Tutela legale','Key man','Multirischi aziendale','RC professionale','Altro'];
const F={
 anag:[['nome','Nome'],['cognome','Cognome'],['stato','Stato','sel',['Prospect','Cliente','Ex cliente']],['nascita','Data di nascita','date'],['luogo','Luogo di nascita'],['cf','Codice fiscale'],['tel','Telefono'],['email','Email'],['indirizzo','Indirizzo','area'],['civile','Stato civile','sel',['—','Celibe/Nubile','Coniugato/a','Unito/a civilmente','Convivente','Separato/a','Divorziato/a','Vedovo/a']],['regime','Regime patrimoniale','sel',['—','Separazione dei beni','Comunione dei beni','Fondo patrimoniale']],['profilo','Profilo di rischio','sel',['—','Conservativo','Prudente','Bilanciato','Dinamico','Aggressivo']],['orizzonte','Orizzonte temporale','sel',['—','Breve (meno di 3 anni)','Medio (3-7 anni)','Lungo (oltre 7 anni)']],['esperienza','Conoscenza ed esperienza','sel',['—','Bassa','Media','Alta']],['prossimo','Prossimo contatto','date'],['obiettivi','Obiettivi ed esigenze','area']],
 fam:[['nome','Nome'],['rel','Relazione','sel',['Coniuge','Convivente','Figlio/a','Genitore','Fratello/Sorella','Altro']],['nascita','Data di nascita','date'],['carico','A carico','bool'],['note','Note']],
 lav:[['lavoro','Condizione lavorativa','sel',['—','Dipendente','Dirigente','Libero professionista','Lavoratore autonomo','Imprenditore','Pensionato','Altro']],['professione','Professione / ruolo'],['datore','Datore di lavoro'],['reddito','Reddito netto annuo (€)','num'],['altriRedditi','Altri redditi annui (€)','num'],['redditoFam','Reddito netto altri familiari (€)','num'],['spese','Spese mensili familiari (€)','num'],['tfr','TFR maturato (€)','num'],['prevObb','Previdenza obbligatoria / note','area']],
 az:[['ragione','Ragione sociale'],['forma','Forma giuridica','sel',['—','Ditta individuale','SNC','SAS','SRL','SRLS','SPA','Studio associato','Altro']],['piva','Partita IVA'],['settore','Settore'],['ruolo','Ruolo','sel',['—','Titolare','Socio','Amministratore','Socio amministratore','Altro']],['quota','Quota (%)','num'],['fatturato','Fatturato (€)','num'],['utile','Utile (€)','num'],['dip','Dipendenti','num'],['tfm','TFM / TFR dipendenti (€)','num'],['note','Note','area']],
 att:[['cat','Categoria','sel',CATS],['desc','Descrizione'],['ist','Istituto / ubicazione'],['valore','Valore (€)','num'],['note','Note']],
 pas:[['tipo','Tipo','sel',['Mutuo','Prestito personale','Leasing','Fido','Finanziamento aziendale','Altro']],['ist','Istituto'],['residuo','Debito residuo (€)','num'],['rata','Rata mensile (€)','num'],['scad','Scadenza','date'],['note','Note']],
 ban:[['ist','Istituto'],['tipo','Rapporto','sel',['Conto corrente','Deposito titoli','Conto deposito','Carta','Cassetta di sicurezza','Altro']],['intest','Intestazione','sel',['Personale','Cointestato','Aziendale']],['rif','Riferimento'],['note','Note']],
 cop:[['tipo','Tipo','sel',COPS],['comp','Compagnia'],['num','N. polizza'],['assic','Assicurato'],['capitale','Capitale / massimale (€)','num'],['premio','Premio annuo (€)','num'],['scad','Scadenza','date'],['note','Note']],
 note:[['data','Data','date'],['testo','Annotazione','area']],
 int:[['cat','Categoria','sel',['Calcio','Altri sport','Vino ed enogastronomia','Cucina','Viaggi','Musica','Arte e cultura','Cinema e teatro','Lettura','Motori','Golf','Vela e nautica','Montagna e sci','Animali','Tecnologia','Moda e design','Volontariato','Altro']],['dett','Dettaglio (es. tifoso del Napoli)'],['tag','Parole chiave (es. Napoli, Serie A)'],['note','Note']],
 ric:[['tipo','Ricorrenza','sel',['Anniversario di matrimonio','Onomastico','Laurea','Nascita figlio/nipote','Pensionamento','Anniversario aziendale','Altro']],['chi','Persona coinvolta'],['data','Data','date'],['annuale','Si ripete ogni anno','bool'],['note','Note']]
};
const TABS=[['anag','Anagrafica'],['fam','Famiglia'],['int','Passioni'],['lav','Lavoro e aziende'],['pat','Patrimonio'],['ban','Banche'],['cop','Coperture'],['doc','Documenti'],['note','Note'],['ana','Analisi']];
const ARR_TITLES={fam:'Nucleo familiare',az:'Aziende e partecipazioni',att:'Attività',pas:'Passività',ban:'Rapporti bancari',cop:'Coperture assicurative in essere',note:'Diario',int:'Hobby e passioni',ric:'Ricorrenze personali'};
const ROW_NAME={fam:r=>r.nome||r.rel||'Familiare',az:r=>r.ragione||'Azienda',att:r=>(r.cat||'Attività')+(r.desc?' · '+r.desc:''),pas:r=>(r.tipo||'Passività')+(r.ist?' · '+r.ist:''),ban:r=>(r.ist||'Istituto')+(r.tipo?' · '+r.tipo:''),cop:r=>(r.tipo||'Copertura')+(r.comp?' · '+r.comp:''),note:r=>r.data?fmtD(r.data):'Nota',int:r=>(r.cat||'Passione')+(r.dett?' · '+r.dett:''),ric:r=>(r.tipo||'Ricorrenza')+(r.chi?' · '+r.chi:'')+(r.data?' · '+fmtD(r.data):'')};
const FIRMA='Massimiliano Di Luccio';
const LOCK_MIN=10;

/* ================== Utilità ================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EUR=(()=>{try{return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0,useGrouping:'always'})}catch(e){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0})}})();
const eur=n=>EUR.format(Math.round(n||0));
function num(v){if(v==null||v==='')return 0;if(typeof v==='number')return v;let s=String(v).replace(/[€\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const n=parseFloat(s);return isNaN(n)?0:n}
function fmtD(d){if(!d)return'';const[y,m,g]=d.split('-');return g?`${g}/${m}/${y}`:d}
function today(){const d=new Date();return d.toISOString().slice(0,10)}
function todayIT(){const d=new Date();return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}
function age(d){if(!d)return null;const b=new Date(d),n=new Date();if(isNaN(b))return null;let a=n.getFullYear()-b.getFullYear();const m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))a--;return a}
function daysTo(d){if(!d)return null;const t=new Date(d+'T00:00:00'),n=new Date(today()+'T00:00:00');return Math.round((t-n)/864e5)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fullName=c=>[c.cognome,c.nome].filter(Boolean).join(' ')||'Nuovo cliente';
const initials=c=>((c.cognome||'?')[0]+(c.nome||'')[0]||'').toUpperCase();
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}

/* ================== Cifratura (AES-GCM + PBKDF2) ================== */
const TE=new TextEncoder(),TD=new TextDecoder();
const b64=u=>{let s='';const a=new Uint8Array(u);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){const base=await crypto.subtle.importKey('raw',TE.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encJSON(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,TE.encode(JSON.stringify(obj)));return{iv:b64(iv),ct:b64(ct)}}
async function decJSON(key,e){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(e.iv)},key,unb64(e.ct));return JSON.parse(TD.decode(pt))}

/* ================== Archiviazione ================== */
function idbOpen(){return new Promise((res,rej)=>{const q=indexedDB.open('archivio_clienti',1);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('main'))d.createObjectStore('main');if(!d.objectStoreNames.contains('files'))d.createObjectStore('files')};q.onsuccess=()=>{try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}res(q.result)};q.onerror=()=>rej(q.error)})}
function idbReq(d,store,mode,fn){return new Promise((res,rej)=>{const tx=d.transaction(store,mode);const q=fn(tx.objectStore(store));let out;q.onsuccess=()=>{out=q.result};tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
function idbAll(d,store){return new Promise((res,rej)=>{const out={};const tx=d.transaction(store,'readonly');const q=tx.objectStore(store).openCursor();q.onsuccess=()=>{const c=q.result;if(c){out[c.key]=c.value;c.continue()}};tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error)})}
/* salvataggio file: capacità downloads dentro Claude, link di download nell'app autonoma */
async function saveFile(filename,data){
 if(store.dl)return store.dl.save({filename,data});
 const blob=data instanceof Blob?data:new Blob([data],{type:filename.endsWith('.json')?'application/json':filename.endsWith('.html')?'text/html':'application/octet-stream'});
 const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);return{status:'saved'};
}
const LS='archivio_clienti_cf_v1';
const store={mode:null,col:null,dl:null,
 async init(){
  let db=null,user=null,id=null;
  try{if(window.claude&&claude.use){let dc,sm;[db,user,this.dl,dc,sm]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads'),claude.use('dictation').catch(()=>null),claude.use('sample').catch(()=>null)]);DICT=dc;SAMPLE=sm;if(user)id=await user.id();initDict()}}catch(e){}
  if(db&&id){this.mode='cloud';this.col=db.collection('data/users/'+id);return}
  if(!window.claude&&window.indexedDB){try{this.idb=await idbOpen();this.mode='idb';return}catch(e){}}
  try{localStorage.setItem(LS+'_t','1');localStorage.removeItem(LS+'_t');this.mode='local'}catch(e){this.mode='mem'}
 },
 _local(){try{return JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){return{}}},
 async loadAll(){
  if(this.mode==='cloud'){
   const snap=await Promise.race([this.col.get(),new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),10000))]);
   const out={};snap.docs.forEach(d=>{if(d.exists)out[d.id]=d.data()});return out;
  }
  if(this.mode==='local')return this._local();
  if(this.mode==='idb')return idbAll(this.idb,'main');
  return memStore;
 },
 async put(id,data){
  if(this.mode==='cloud'){try{await this.col.doc(id).set(data)}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*700));await this.col.doc(id).set(data)}else throw e}return}
  if(this.mode==='local'){const all=this._local();all[id]=data;localStorage.setItem(LS,JSON.stringify(all));return}
  if(this.mode==='idb')return idbReq(this.idb,'main','readwrite',st=>st.put(data,id));
  memStore[id]=data;
 },
 _fc(){return this.col.doc('filestore').collection('chunks')},
 async putChunk(k,data){if(this.mode==='cloud'){await this._fc().doc(k).set(data);return}if(this.mode==='local'){localStorage.setItem(LS+'_f_'+k,JSON.stringify(data));return}if(this.mode==='idb')return idbReq(this.idb,'files','readwrite',st=>st.put(data,k));memFiles[k]=data},
 async getChunk(k){if(this.mode==='cloud'){const d=await this._fc().doc(k).get();return d.exists?d.data():null}if(this.mode==='local'){const v=localStorage.getItem(LS+'_f_'+k);return v?JSON.parse(v):null}if(this.mode==='idb')return (await idbReq(this.idb,'files','readonly',st=>st.get(k)))||null;return memFiles[k]||null},

let SINK=null;
function initDict(){
 if(!DICT)return;
 DICT.onPartial(({text})=>{SINK&&SINK.partial(text)});
 DICT.onFinal(({text})=>{SINK&&SINK.final(text)});
 DICT.onState(({state,reason})=>{if(state==='idle')speech.active=false;if(state==='idle'&&(reason==='not_granted'||reason==='unavailable'))dictOff=true;SINK&&SINK.state(state,reason)});
}
const speech={active:false,_rec:null,_want:false,_restarts:0,
 kind(){return DICT&&!dictOff?'claude':(SR?'web':null)},
 isActive(){return this.kind()==='claude'?!!(DICT&&DICT.active()):this.active},
 start(sink){SINK=sink;const k=this.kind();
  if(!k)return Promise.reject({code:'unavailable'});
  if(k==='claude'){this.active=true;return DICT.start({language:'it'}).catch(e=>{this.active=false;if(e&&(e.code==='not_granted'||e.code==='unavailable'))dictOff=true;throw e})}
  this._want=true;this.active=true;this._restarts=0;
  try{this._web()}catch(e){this.active=false;this._want=false;return Promise.reject({code:'upstream_error'})}
  sink.state('listening');return Promise.resolve()},
 _web(){const r=new SR();r.lang='it-IT';r.interimResults=true;r.continuous=!/Android/i.test(navigator.userAgent);r.maxAlternatives=1;
  r.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal){if(t.trim())SINK&&SINK.final(' '+t.trim())}else interim+=t}SINK&&SINK.partial(interim);this._restarts=0};
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){this._want=false;this._reason='not_granted'}else if(e.error==='audio-capture'){this._want=false;this._reason='upstream_error'}};
  r.onend=()=>{if(this._want&&this._restarts<50){this._restarts++;setTimeout(()=>{if(!this._want)return this._stopped('stopped');try{this._web()}catch(e){this._stopped('upstream_error')}},200)}else this._stopped(this._reason||'stopped')};
  this._reason=null;this._rec=r;r.start()},
 _stopped(reason){if(!this.active)return;this.active=false;this._rec=null;SINK&&SINK.state('idle',reason)},
 async stop(){if(this.kind()==='claude'){if(DICT&&DICT.active())await DICT.stop().catch(()=>{});return}
  this._want=false;if(this._rec){try{this._rec.stop()}catch(e){this._stopped('stopped')}}else this._stopped('stopped')}
};

function analizza(c){
 const att=c.att||[],pas=c.pas||[],cop=c.cop||[],fam=c.fam||[],az=c.az||[];
 const byCat={};CATS.forEach(k=>byCat[k]=0);att.forEach(a=>{byCat[a.cat||'Altro']=(byCat[a.cat||'Altro']||0)+num(a.valore)});
 const totAtt=att.reduce((s,a)=>s+num(a.valore),0),totPas=pas.reduce((s,a)=>s+num(a.residuo),0),rate=pas.reduce((s,a)=>s+num(a.rata),0);
 const netto=totAtt-totPas,liq=byCat['Liquidità'];
 const fin=liq+byCat['Titoli e fondi']+byCat['Gestioni patrimoniali']+byCat['Polizze di investimento']+byCat['Previdenza complementare'];
 const eta=age(c.nascita),aCarico=fam.filter(f=>f.carico).length;
 const reddito=num(c.reddito),spese=num(c.spese),mesiLiq=spese>0?liq/spese:null;
 const has=t=>cop.some(x=>x.tipo===t);
 const capCop=t=>cop.filter(x=>x.tipo===t).reduce((s,x)=>s+num(x.capitale),0);
 const anni=num(c.anniTCM)||5;
 const tcmEs=capCop('TCM / Caso morte')+capCop('CPI su mutuo');
 const fabb=totPas+reddito*anni;
 const gap=Math.max(0,fabb-tcmEs);
 const premi=cop.reduce((s,x)=>s+num(x.premio),0);
 const autonomo=['Libero professionista','Lavoratore autonomo','Imprenditore'].includes(c.lavoro);
 const O=[];const add=(k,t,d)=>O.push({k,t,d});
 if((aCarico>0||totPas>0||['Coniugato/a','Unito/a civilmente','Convivente'].includes(c.civile))&&gap>0&&reddito+totPas>0)
  add('tcm','Protezione caso morte (TCM)',`Fabbisogno stimato ${eur(fabb)} (debiti residui ${eur(totPas)} + ${anni} anni di reddito netto). Capitali già assicurati ${eur(tcmEs)}: scopertura indicativa ${eur(gap)}.`);
 if(mesiLiq!==null&&mesiLiq>6)add('liq','Liquidità in eccesso',`La liquidità copre circa ${mesiLiq.toFixed(1).replace('.',',')} mesi di spese. Tenendo 6 mesi di riserva restano circa ${eur(liq-6*spese)} da valutare per investimento o piano di accumulo.`);
 if(mesiLiq!==null&&mesiLiq<3)add('riserva','Riserva di emergenza',`La liquidità copre solo ${mesiLiq.toFixed(1).replace('.',',')} mesi di spese: valutare la costituzione di una riserva prima di nuovi investimenti.`);
 if(autonomo&&!has('Infortuni')&&!has('Invalidità permanente da malattia'))add('inf','Infortuni e invalidità permanente','Reddito da lavoro autonomo senza coperture per infortuni o invalidità da malattia.');
 if(c.lavoro==='Libero professionista'&&!has('RC professionale'))add('rcp','RC professionale','Nessuna RC professionale censita.');
 if(eta!==null&&eta>=50&&!has('Long Term Care'))add('ltc','Long Term Care',`Età ${eta} anni senza copertura per la non autosufficienza.`);
 if(eta!==null&&eta>=40&&!has('Salute / rimborso spese'))add('salute','Copertura salute','Nessuna polizza salute o rimborso spese mediche censita.');
 if(eta!==null&&eta<62&&c.lavoro!=='Pensionato'&&!byCat['Previdenza complementare'])add('prev','Previdenza complementare','Nessuna posizione di previdenza complementare censita (possibile vantaggio fiscale sui contributi).');
 if(az.some(a=>['Titolare','Socio','Socio amministratore','Amministratore'].includes(a.ruolo))&&!has('Key man'))add('keyman','Protezione aziendale (Key man)','Ruolo chiave in azienda senza copertura Key man.');
 if(az.some(a=>num(a.dip)>0))add('welfare','TFR/TFM e welfare aziendale','Aziende con dipendenti: valutare accantonamento TFR/TFM e piani di welfare.');
 if(byCat['Immobili']>0&&!has('Casa / incendio'))add('casa','Protezione casa e patrimonio immobiliare','Immobili censiti senza polizza casa/incendio.');
 if(!has('RC capofamiglia')&&(aCarico>0||fam.length>0))add('rcf','RC capofamiglia','Nessuna RC capofamiglia censita.');
 if(netto>=500000||(eta!==null&&eta>=60&&netto>=200000)||byCat['Partecipazioni']>0)add('succ','Pianificazione successoria e passaggio generazionale',`Patrimonio netto censito ${eur(netto)}${byCat['Partecipazioni']>0?', con partecipazioni societarie':''}.`);
 cop.forEach((x,i)=>{const g=daysTo(x.scad);if(g!==null&&g>=0&&g<=90)add('scad'+i,'Copertura in scadenza: '+(x.tipo||''),`${x.comp||''} scade il ${fmtD(x.scad)} (tra ${g} giorni): occasione di revisione.`)});
 return{byCat,totAtt,totPas,rate,netto,liq,fin,eta,aCarico,reddito,spese,mesiLiq,anni,tcmEs,fabb,gap,premi,O};
}

 const files={};let miss=0;

async function importa(data,pw){
 const er=$('#err');er.textContent='Verifica…';let key;
 try{key=await deriveKey(pw,unb64(data.meta.salt));await decJSON(key,data.meta)}catch(e){er.textContent='Password del backup errata.';return}
 let n=0,nd=0;const FL=data.files||{};
 for(const v of Object.values(data.items||{})){try{const c=await decJSON(key,v);
  const docs=[];for(const d of (c.docs||[])){try{let ct='';for(let i=0;i<d.n;i++){if(FL[d.id+'_'+i]==null)throw 0;ct+=FL[d.id+'_'+i]}
   const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(d.iv)},key,unb64(ct));const iv=crypto.getRandomValues(new Uint8Array(12));const nct=b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},S.key,buf));

/* ================== Sblocco biometrico (Face ID / impronta) ================== */
const FACE=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M9 10v1M15 10v1M12 10v3h-1M9.5 16c1.5 1 3.5 1 5 0"/></svg>`;
const BIO_NAME=/iPhone|iPad|Mac/i.test(navigator.userAgent)?'Face ID / Touch ID':'impronta o volto';
const BIO_LS='archivio_bio_v1';
function bioAvail(){return !window.claude&&!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext)}
function bioCfg(){try{return JSON.parse(localStorage.getItem(BIO_LS)||'null')}catch(e){return null}}
function bioOn(){return bioAvail()&&!!bioCfg()}
function kdb(){return new Promise((res,rej)=>{const q=indexedDB.open('archivio_bio',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function kput(v){const d=await kdb();return idbReq(d,'k','readwrite',st=>st.put(v,'dev'))}
async function kget(){const d=await kdb();return idbReq(d,'k','readonly',st=>st.get('dev'))}
async function kdel(){try{const d=await kdb();await idbReq(d,'k','readwrite',st=>st.delete('dev'))}catch(e){}}
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function bioAssert(cfg){
 const opts={publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:unb64(cfg.id),transports:['internal']}],userVerification:'required',timeout:60000}};
 if(cfg.mode==='prf')opts.publicKey.extensions={prf:{eval:{first:unb64(cfg.salt)}}};
 const a=await navigator.credentials.get(opts);
 if(cfg.mode==='prf'){const out=a.getClientExtensionResults().prf?.results?.first;if(!out)throw new Error('prf');return crypto.subtle.importKey('raw',out,'AES-GCM',false,['encrypt','decrypt'])}
 const k=await kget();if(!k)throw new Error('key');return k;
}
function bioBox(){
 const on=bioOn();
 $('#modal').innerHTML=`<div class="modal"><div class="card gold"><h2>${FACE} Sblocco <em>biometrico</em></h2>
 ${on?`<p class="note" style="margin:10px 0">Lo sblocco con ${BIO_NAME} è attivo su questo telefono. La password resta valida e serve se la biometria non funziona.</p>
  <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-a="modalclose">Chiudi</button><button class="btn del" id="biooff">Disattiva</button></div>`
 :`<p class="note" style="margin:10px 0">Apri l'archivio con ${BIO_NAME} invece di digitare la password. Per attivarlo, conferma la password dell'archivio.</p>
  <input type="password" id="biopw" autocomplete="current-password" placeholder="Password dell'archivio"><div class="err" id="err"></div>
  <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn ghost" data-a="modalclose">Annulla</button><button class="btn pri" id="bioon">Attiva</button></div>`}</div></div>`;
 if($('#biooff'))$('#biooff').onclick=async()=>{localStorage.removeItem(BIO_LS);await kdel();closeModal();renderList();toast('Sblocco biometrico disattivato')};
 if($('#bioon'))$('#bioon').onclick=bioEnable;
}
async function bioEnable(){
 const pw=$('#biopw').value,er=$('#err');er.textContent='';
 try{const k=await deriveKey(pw,unb64(S.meta.salt));await decJSON(k,S.meta)}catch(e){er.textContent='Password errata.';return}
 try{
  const cred=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'Archivio Clienti'},user:{id:rnd(16),name:'archivio-clienti',displayName:'Archivio Clienti'},
   pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000,attestation:'none',extensions:{prf:{}}}});
  const cfg={id:b64(cred.rawId),mode:'dev',salt:b64(rnd(32))};
  let key=null;
  if(cred.getClientExtensionResults().prf?.enabled){cfg.mode='prf';try{key=await bioAssert(cfg)}catch(e){cfg.mode='dev';key=null}}
  if(!key){key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);await kput(key);cfg.mode='dev'}
  const e=await encJSON(key,{pw});cfg.iv=e.iv;cfg.ct=e.ct;
  localStorage.setItem(BIO_LS,JSON.stringify(cfg));closeModal();renderList();toast('Sblocco con '+BIO_NAME+' attivato');
 }catch(e){er.textContent=e&&e.name==='NotAllowedError'?'Operazione annullata o non consentita.':e&&e.name==='NotSupportedError'?'Questo telefono o browser non supporta lo sblocco biometrico per le app web.':'Attivazione non riuscita: riprova.'}
}
async function bioUnlock(){
 const cfg=bioCfg(),er=$('#err');if(!cfg)return;er.textContent='';
 try{const key=await bioAssert(cfg);const{pw}=await decJSON(key,{iv:cfg.iv,ct:cfg.ct});await doUnlock(pw)}
 catch(e){er.textContent=e&&e.name==='NotAllowedError'?'Riconoscimento annullato: riprova o usa la password.':'Sblocco biometrico non riuscito: usa la password. Se hai cambiato impostazioni del telefono, riattivalo dopo l\'accesso.';setTimeout(()=>$('#pw')&&$('#pw').focus(),50)}
}

/* ================== Ricezione schede da Claude (cassetta cifrata) ==================
 Claude prepara le schede e le cifra con la chiave PUBBLICA di questa app (RSA-OAEP 3072 + AES-GCM),
 poi le pubblica nella cartella inbox/ del sito. Solo questa app, con la chiave privata custodita
 nell'archivio cifrato, può leggerle. Vedi CLAUDE.md nel repository. */
const INBOX_ICO=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 13l2-8h12l2 8v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/></svg>`;
let INBOX=null,inboxBusy=false;
function inboxAvail(){return !window.claude&&location.protocol!=='file:'}
async function inboxLoad(){if(INBOX||!S.raw.inbox)return INBOX;try{const d=await decJSON(S.key,S.raw.inbox);INBOX={pub:S.raw.inbox.pub,priv:await crypto.subtle.importKey('jwk',d.priv,{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']),privJwk:d.priv,done:d.done||[],log:d.log||[]}}catch(e){INBOX=null}return INBOX}
async function inboxSave(){const e=await encJSON(S.key,{priv:INBOX.privJwk,done:INBOX.done.slice(-500),log:INBOX.log.slice(-50)});e.pub=INBOX.pub;await store.put('inbox',e);S.raw.inbox=e}
function pubText(pub){return 'CHIAVE-ARCHIVIO-CLIENTI:'+btoa(JSON.stringify({kty:pub.kty,n:pub.n,e:pub.e,alg:'RSA-OAEP-256'}))}
async function inboxEnable(){
 const kp=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:3072,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);
 const pub=await crypto.subtle.exportKey('jwk',kp.publicKey),priv=await crypto.subtle.exportKey('jwk',kp.privateKey);
 INBOX={pub:{kty:pub.kty,n:pub.n,e:pub.e},privJwk:priv,priv:kp.privateKey,done:[],log:[]};await inboxSave();
}
function inboxBox(){
 const on=!!S.raw.inbox;
 $('#modal').innerHTML=`<div class="modal"><div class="card gold vb"><h2>${INBOX_ICO} Ricezione <em>da Claude</em></h2>
 ${on?`<p class="note" style="margin:10px 0">Attiva. Ogni volta che apri l'app (e ogni 5 minuti mentre è aperta) vengono importate le schede e i documenti che Claude ti ha preparato in chat.</p>
  <div class="lbl">Chiave di consegna</div><p class="note">Se Claude te la chiede, copiala e incollala in chat. È pubblica: serve solo a cifrare le schede destinate a te.</p>
  <textarea id="pubk" readonly style="min-height:70px;font-size:12px">${esc(pubText(S.raw.inbox.pub))}</textarea>
  <div class="row" style="margin-top:6px"><button class="btn sm" id="cpk">Copia chiave</button><button class="btn sm" id="ichk">Controlla ora</button></div>
  <div class="lbl">Ultime ricezioni</div><div id="ilog" class="card" style="padding:4px 12px"><div class="empty" style="padding:6px 0">Caricamento…</div></div>
  <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn sm del" id="ioff">Disattiva</button><button class="btn ghost" data-a="modalclose">Chiudi</button></div>`
 :`<p class="note" style="margin:10px 0">Quando mi mandi in chat documenti o informazioni su un cliente, preparo la scheda e la consegno direttamente qui, cifrata: la apre solo questa app.</p>
  <ol class="note" style="padding-left:18px;margin:8px 0"><li>Tocca <b>Attiva</b>: l'app crea la sua chiave di consegna.</li><li>Copia la chiave e incollala in chat con Claude (basta una volta).</li><li>Da lì in poi le schede arrivano da sole quando apri l'app.</li></ol>
  <div class="err" id="err"></div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost" data-a="modalclose">Annulla</button><button class="btn pri" id="ion">Attiva</button></div>`}</div></div>`;
 if($('#ion'))$('#ion').onclick=async()=>{$('#ion').disabled=true;$('#err').textContent='Creazione della chiave…';try{await inboxEnable();inboxBox();renderList()}catch(e){$('#err').textContent='Creazione non riuscita: riprova.';$('#ion').disabled=false}};
 if($('#cpk'))$('#cpk').onclick=async()=>{try{await navigator.clipboard.writeText($('#pubk').value);toast('Chiave copiata: incollala in chat')}catch(e){$('#pubk').select();toast('Selezionata: copiala dal menu')}};
 if($('#ichk'))$('#ichk').onclick=()=>inboxCheck(true);
 if($('#ioff'))$('#ioff').onclick=()=>confirmBox('Disattivare la ricezione? Le schede già importate restano; quelle non ancora ricevute non saranno più leggibili e la chiave andrà ricomunicata a Claude.',async()=>{await store.del('inbox');delete S.raw.inbox;INBOX=null;renderList();toast('Ricezione disattivata')});
 if($('#ilog'))inboxLoad().then(I=>{const el=$('#ilog');if(!el)return;el.innerHTML=I&&I.log.length?I.log.slice().reverse().slice(0,10).map(l=>`<div class="chg"><span class="dt">${fmtD(l.data)}</span> ${esc(l.t)}</div>`).join(''):'<div class="empty" style="padding:6px 0">Ancora nessuna scheda ricevuta.</div>'});
}
async function inboxCheck(manual){
 if(!inboxAvail()||!S.key||!S.raw.inbox||inboxBusy)return;inboxBusy=true;
 try{
  const I=await inboxLoad();if(!I)throw new Error('chiave');
  const res=await fetch('inbox/index.json?t='+Date.now(),{cache:'no-store'});if(!res.ok){if(manual)toast('Nessuna scheda in arrivo');return}
  const idx=await res.json();const nuovi=(idx.pacchetti||[]).filter(p=>p&&p.id&&!I.done.includes(p.id));
  if(!nuovi.length){if(manual)toast('Nessuna nuova scheda');return}
  const esiti=[];
  for(const p of nuovi){
   try{const r=await fetch('inbox/'+encodeURIComponent(p.file||p.id+'.json')+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const pk=await r.json();
    if(pk.fp&&pk.fp!==I.pub.n.slice(0,16)){I.done.push(p.id);continue}
    const raw=await crypto.subtle.decrypt({name:'RSA-OAEP'},I.priv,unb64(pk.ek));const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
    const pay=JSON.parse(TD.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(pk.iv)},k,unb64(pk.ct))));
    const t=pay.tipo==='cf'?await mergeCF(pay):await mergeScheda(pay);esiti.push(t);I.log.push({data:today(),t});I.done.push(p.id);await inboxSave()}
   catch(e){/* pacchetto non destinato a questa chiave o non ancora pubblicato: si riprova più tardi */}
  }
  await flush();
  if(esiti.length){if(S.view==='list')renderList();
   $('#modal').innerHTML=`<div class="modal"><div class="card gold"><div class="lbl" style="margin-top:0">${INBOX_ICO} Ricevuto da Claude</div>${esiti.map(t=>`<div class="chg">${esc(t)}</div>`).join('')}<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pri" data-a="modalclose">OK</button></div></div></div>`}
  else if(manual)toast('Nessuna nuova scheda leggibile');
 }catch(e){if(manual)toast('Controllo non riuscito: verifica la connessione')}
 finally{inboxBusy=false}
}
setInterval(()=>{if(!document.hidden)inboxCheck(false)},300000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(()=>inboxCheck(false),800)});
async function mergeScheda(pay){
 const cli=pay.cliente||{};const P=parseExtract({campi:cli,aggiungi:cli,extra:pay.extra||''},'','');
 const key=x=>(x||'').toLowerCase().trim();
 let c=Object.values(S.clients).find(x=>P.campi.cf&&key(x.cf)===key(P.campi.cf))||Object.values(S.clients).find(x=>P.campi.cognome&&key(x.nome)===key(P.campi.nome)&&key(x.cognome)===key(P.campi.cognome));
 const isNew=!c;
 if(isNew){c={id:uid(),stato:['Cliente','Prospect','Ex cliente'].includes(cli.stato)?cli.stato:'Prospect',created:Date.now(),updated:Date.now(),fam:[],int:[],ric:[],az:[],att:[],pas:[],ban:[],cop:[],note:[],docs:[]};S.clients[c.id]=c}
 let nCampi=0,nRighe=0;
 for(const[k,v]of Object.entries(P.campi)){if(isNew||c[k]==null||c[k]===''||c[k]==='—'){c[k]=v;nCampi++}}
 V_ARR.forEach(k=>{c[k]=c[k]||[];for(const row of P.rows[k]){const sig=JSON.stringify(row);const dup=c[k].some(x=>JSON.stringify(x)===sig||(k==='cop'&&row.num&&x.num===row.num));if(!dup){c[k].push(row);nRighe++}}});
 const nota=[pay.provenienza,P.extra].filter(Boolean).join('\n\n');
 if(nota){(c.note=c.note||[]).push({data:today(),testo:'Da Claude: '+nota})}
 let nDoc=0;
 for(const f of (pay.files||[])){try{c.docs=c.docs||[];if(c.docs.some(d=>d.nome===f.nome&&d.size===f.size))continue;
  const tipo=DOC_EXT[f.tipo]?f.tipo:'application/pdf';const iv=rnd(12);const ct=b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},S.key,unb64(f.data)));
  const id='d'+uid();const n=Math.ceil(ct.length/CHUNK);for(let i=0;i<n;i++)await store.putChunk(id+'_'+i,{d:ct.slice(i*CHUNK,(i+1)*CHUNK)});
  c.docs.push({id,nome:f.nome,tipo,size:f.size,data:today(),n,iv:b64(iv)});nDoc++}catch(e){}}
 c.updated=Date.now();dirty.add(c.id);
 return `${fullName(c)}: ${isNew?'nuova scheda':'scheda aggiornata'}${nDoc?`, ${nDoc} ${nDoc===1?'documento':'documenti'}`:''}${!isNew&&(nCampi||nRighe)?` (${nCampi+nRighe} dati aggiunti)`:''}`;
}

function canShareFiles(){try{return !!(navigator.canShare&&navigator.canShare({files:[new File(['x'],'x.pdf',{type:'application/pdf'})]}))}catch(e){return false}}
function schedaPerClaude(c){
 const L=[`SCHEDA DALL'APP ARCHIVIO CLIENTI – ${fullName(c)} (${c.stato||'Prospect'}), aggiornata al ${todayIT()}`,''];
 const kvs=f=>f.map(x=>{const v=fval(x,c[x[0]]);return v?`- ${x[1]}: ${v}`:''}).filter(Boolean);
 const a=kvs(F.anag.filter(x=>!['nome','cognome'].includes(x[0])));if(a.length)L.push('ANAGRAFICA',...a,'');
 const l=kvs(F.lav);if(l.length)L.push('LAVORO E REDDITI',...l,'');
 for(const k of ['fam','int','ric','az','att','pas','ban','cop']){const rows=c[k]||[];if(!rows.length)continue;L.push(ARR_TITLES[k].toUpperCase(),...rows.map(r=>'- '+rowDetail(k,r)),'')}
 const A=analizza(c);L.push('SINTESI',`- Patrimonio netto ${eur(A.netto)} (attività ${eur(A.totAtt)}, passività ${eur(A.totPas)}), finanziario ${eur(A.fin)}`,`- Fabbisogno caso morte ${eur(A.fabb)}, già assicurato ${eur(A.tcmEs)}, scopertura ${eur(A.gap)}`);
 if(A.O.length)L.push('- Opportunità rilevate: '+A.O.map(o=>o.t).join('; '));
 if(c.propNote)L.push('- Note per la proposta: '+c.propNote);
 L.push('');
 const notes=(c.note||[]).slice(-8);if(notes.length)L.push('DIARIO (ultime note)',...notes.map(n=>`- ${fmtD(n.data)}: ${String(n.testo||'').replace(/\s+/g,' ').slice(0,1500)}`),'');
 if((c.docs||[]).length)L.push('DOCUMENTI ALLEGATI NELL\'APP',...c.docs.map(d=>`- ${d.nome} (${fmtD(d.data)})`),'');
 const cli={};for(const f of [...F.anag,...F.lav])if(c[f[0]]!=null&&c[f[0]]!==''&&c[f[0]]!=='—')cli[f[0]]=c[f[0]];
 for(const k of ['fam','int','ric','az','att','pas','ban','cop'])if((c[k]||[]).length)cli[k]=c[k];
 L.push('Dati strutturati (per aggiornare la scheda):','```json',JSON.stringify({archivio:'scheda-app',cliente:cli}),'```');
 return L.join('\n');
}

 <p class="note" style="margin:8px 0">Copia la scheda di <b>${esc(fullName(c))}</b> e incollala nella chat con Claude, aggiungendo cosa vuoi fare (una proposta, un'analisi, una relazione…). ${(c.docs||[]).length?'I documenti allegati si inviano dalla sezione Documenti con Condividi.':''}</p>

 m20Cl:{'PTF sotto 20 mln':false,'PTF 20-50 mln':true,'PTF 50-150 mln':true,'PTF oltre 150 mln':true}, // par. J: +20% solo dai 20 mln
 metodo:'fascia',  // aliquota della fascia raggiunta su tutta la raccolta (esempi del par. J)
 m20:20,m10:10,revoAlt:7000,assSoglia:500,ridNeg:50,
 cap:{'PTF sotto 20 mln':[250000,450000],'PTF 20-50 mln':[300000,500000],'PTF 50-150 mln':[350000,550000],'PTF oltre 150 mln':[420000,650000]},

async function cfSave(){const e=await encJSON(S.key,CF);e.u=Date.now();try{await store.put('cf2026',e);S.raw.cf2026=e;setStatus('Salvato ✓','ok')}catch(err){toast('Salvataggio non riuscito')}}
function fasciaDi(v,P){let f=null;for(const x of P.fasce)if(v>=x.da)f=x;return f}
const rateOf=(f,evo)=>evo&&f.aliqEvo!=null?f.aliqEvo:f.aliq;
function bonusPista(vK,P,evo){ // vK in k€ → bonus in €
 if(!(vK>0))return 0;const F2=P.fasce;if(vK<F2[0].da)return 0;
 if(P.metodo==='scaglioni'){let b=0;for(let i=0;i<F2.length;i++){const lo=i===0?0:F2[i].da,hi=i+1<F2.length?F2[i+1].da:Infinity;if(vK>lo)b+=(Math.min(vK,hi)-lo)*1000*rateOf(F2[i],evo)/100}return b}
 const f=fasciaDi(vK,P);return vK*1000*rateOf(f,evo)/100;
}
function calcCF(c,Pin){
 const P0=Pin||CF.params;const P=Object.assign({},P0,{fasce:(P0.fasceCl&&P0.fasceCl[c.cluster])||P0.fasce});const rn=num(c.rn),revo=num(c.revo),ass=num(c.ass);
 const accesso=P.fasce[0].da;
 const bRN=bonusPista(rn,P,false);let bEVO=bonusPista(revo,P,true);const neg=rn<0;if(neg)bEVO*=1-P.ridNeg/100;
 const m20on=!P.m20Cl||P.m20Cl[c.cluster]!==false;const ok20=m20on&&rn>=accesso&&(revo>=rn||(revo>=P.revoAlt&&rn>=accesso));const ok10=ass>=P.assSoglia;
 const pct=(ok20?P.m20:0)+(ok10?P.m10:0);
 const base=bRN+bEVO;const lordo=P.cumulo==='prodotto'?base*(1+(ok20?P.m20/100:0))*(1+(ok10?P.m10/100:0)):base*(1+pct/100);
 const capA=(P.cap[c.cluster]||P.cap['PTF 20-50 mln'])[c.opPart?1:0];const bonus=Math.min(lordo,capA);
 const fRN=fasciaDi(rn,P),fEVO=fasciaDi(revo,P);
 return{m20on,aRN:fRN?rateOf(fRN,false):null,aEVO:fEVO?rateOf(fEVO,true):null,P,rn,revo,ass,bRN,bEVO,neg,ok20,ok10,pct,base,lordo,cap:capA,bonus,capped:lordo>capA,fRN:fasciaDi(rn,P),fEVO:fasciaDi(revo,P)};
}
function cfHints(c){
 const R=calcCF(c),P=R.P,H=[];
 const next=v=>P.fasce.find(f=>f.da>v);
 for(const[k,lab]of [['rn','Raccolta netta'],['revo','Raccolta evoluta']]){const v=R[k];const n=next(v);if(!n)continue;const gap=n.da-v;
  const sim=calcCF(Object.assign({},c,{[k]:n.da}));const delta=sim.bonus-R.bonus;
  H.push({t:`${lab}: mancano ${fmtK(gap)} per ${v<P.fasce[0].da?'entrare nel bonus':'la fascia '+fmtPct(rateOf(n,k==='revo'))}`,d:`bonus stimato +${eur(delta)}`})}
 if(!R.ok20&&R.m20on){let t;if(R.rn<P.fasce[0].da)t=`porta la raccolta netta a ${fmtK(P.fasce[0].da)} (mancano ${fmtK(P.fasce[0].da-R.rn)})`;else t=`raccolta evoluta almeno pari alla netta (mancano ${fmtK(R.rn-R.revo)})`;
  const sim=calcCF(Object.assign({},c,R.rn<P.fasce[0].da?{rn:P.fasce[0].da}:{revo:R.rn}));H.push({t:`Maggiorazione +${P.m20}%: ${t}`,d:`bonus stimato +${eur(sim.bonus-R.bonus)}`})}
 if(!R.ok10){const sim=calcCF(Object.assign({},c,{ass:P.assSoglia}));H.push({t:`Maggiorazione +${P.m10}%: raccolta netta assicurativa a ${fmtK(P.assSoglia)} (mancano ${fmtK(P.assSoglia-R.ass)})`,d:`bonus stimato +${eur(sim.bonus-R.bonus)}`})}
 return H.sort((a,b)=>num(b.d.replace(/\D/g,''))-num(a.d.replace(/\D/g,'')));
}
const fmtK=k=>eur(k*1000);
const fmtPct=p=>String(p).replace('.',',')+'%';

 $('#app').innerHTML=topbar('Incentivazione <em>CF 2026</em>',`<button class="btn ico" data-a="cfback" title="Indietro" aria-label="Indietro">←</button>`,`<span class="status ${S.statusCls}" id="st">${esc(S.status)}</span>`)+`<div class="wrap">

  <div class="row" style="gap:6px;margin:6px 0 8px">${R.ok20?`<span class="badge g">+${CF.params.m20}% evoluta</span>`:''}${R.ok10?`<span class="badge g">+${CF.params.m10}% assicurativa</span>`:''}${R.neg?'<span class="badge r">RN negativa: evoluta -50%</span>':''}${R.capped?'<span class="badge r">al tetto massimo</span>':''}</div>

const EM_TAB=[[60,10000,10000],[85,17500,17500],[100,21000,24000],[120,23000,27000],[140,25000,35000],[160,27000,43000]];
function emData(){CF.em=CF.em||{nome:'Massimiliano Di Luccio',data:today(),obt:{},act:{},auto:true,recl:[]};return CF.em}

function teamAgg(){const P=CF.params;let rn=0,evo=0,ass=0,aRN=0,aEVO=0;const n=CF.consulenti.length;
 for(const c of CF.consulenti){const R=calcCF(c);rn+=R.rn;evo+=R.revo;ass+=R.ass;const s0=R.P.fasce[0].da;if(R.rn>=s0)aRN++;if(R.revo>=s0)aEVO++}
 return{rn,evo,ass,n,aRN,aEVO}}
function emVal(e,T,k){const v=e.act[k];if(v!==undefined&&v!=='')return num(v);return({rn:T.rn,rnSE:T.rn,evo:T.evo,evoSE:T.evo,ass:T.ass,nCF:T.n,aRN:T.aRN,aEVO:T.aEVO})[k]}
const emTier=(p,i)=>{let b=0;for(const t of EM_TAB)if(p>=t[0])b=t[i];return b};
const emSE=p=>p==null?1:p>=70?1:p>=50?.75:p>=0?.65:.55;
const emAtt=p=>p>=80?1:p>=65?.75:p>=50?.5:0;
function calcEM(){
 const e=emData(),T=teamAgg(),o=e.obt;const g=k=>emVal(e,T,k);
 const pc=(a,b)=>num(b)>0?a/num(b)*100:null;
 const A={rn:g('rn'),rnSE:g('rnSE'),evo:g('evo'),evoSE:g('evoSE'),ass:g('ass'),nCF:g('nCF'),aRN:g('aRN'),aEVO:g('aEVO')};
 const pRN=pc(A.rn,o.rn),pEVO=pc(A.evo,o.evo),pRNse=pc(A.rnSE,o.rnSE),pEVOse=pc(A.evoSE,o.evoSE);
 const assF=A.ass<0?0.8:(num(o.ass)>0&&A.ass>=num(o.ass)?1.1:1);
 const attRN=A.nCF?A.aRN/A.nCF*100:0,attEVO=A.nCF?A.aEVO/A.nCF*100:0;
 const t1=emTier(pRN||0,1),t2=emTier(pEVO||0,2);
 const fRN={ass:assF,se:emSE(pRNse),att:emAtt(attRN)},fEVO={ass:assF,se:emSE(pEVOse),att:emAtt(attEVO)};
 const bRN=t1*fRN.ass*fRN.se*fRN.att,bEVO=t2*fEVO.ass*fEVO.se*fEVO.att;
 // reclutamento (Tabella B): RN per reclutato fino a 30 mln, aliquota per RN totale e n. reclutamenti validi, cap 40.000
 const rec=(e.recl||[]).map(x=>({...x,rnC:Math.min(num(x.rn),30000)}));const val=rec.filter(x=>x.valido);
 const rnRec=val.reduce((s,x)=>s+x.rnC,0);const nv=val.length;
 const aliq=nv>=2?(rnRec>=20000?0.04:rnRec>=12500?0.03:0):nv===1?(rnRec>=20000?0.02:rnRec>=12500?0.01:0):0;
 let bRec=0;const recDet=val.map(x=>{const quota=rnRec?x.rnC/rnRec:0;const base=rnRec*1000*aliq/100*quota;const adj=1+(num(x.bm)||0)/100+(x.u45?0.2:0);bRec+=base*adj;return{...x,base,adj,bon:base*adj}});
 const bRecCap=Math.min(bRec,40000);
 return{e,T,A,o,pRN,pEVO,pRNse,pEVOse,attRN,attEVO,t1,t2,fRN,fEVO,bRN,bEVO,assF,rnRec,nv,aliq,recDet,bRec,bRecCap,totale:bRN+bEVO+bRecCap};
}

document.addEventListener('change',async e=>{
 if(e.target.id!=='docf'||!S.cur)return;const c=S.cur,files=[...e.target.files];e.target.value='';

  const tipo=f.type||({pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png'}[(f.name.split('.').pop()||'').toLowerCase()]||'');
  if(!DOC_EXT[tipo]){toast(f.name+': formato non supportato');continue}

   const id='d'+uid();const n=Math.ceil(ct.length/CHUNK);

async function docBlob(d){let ct='';for(let i=0;i<d.n;i++){const ch=await store.getChunk(d.id+'_'+i);if(!ch)throw new Error('mancante');ct+=ch.d}

 try{blob=await docBlob(d)}catch(e){toast('Documento non leggibile');return}
 if(d.tipo.startsWith('image/')){const u=URL.createObjectURL(blob);
  $('#modal').innerHTML=`<div class="modal"><div class="card gold vb"><h2 style="font-size:18px">${esc(d.nome)}</h2><img src="${u}" alt="${esc(d.nome)}" style="width:100%;border-radius:10px;margin:10px 0"><div class="row" style="justify-content:flex-end"><button class="btn" id="dsave">Scarica</button><button class="btn ghost" data-a="modalclose">Chiudi</button></div></div></div>`;
  if($('#dsave'))$('#dsave').onclick=()=>saveFile(docName(d),blob).catch(()=>{});return}
 if(!store.dl&&!window.claude){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),120000);return}
 try{await saveFile(docName(d),blob)}catch(e){if(e&&e.code!=='declined')toast('Apertura non riuscita')}
}
function docDel(id){const c=S.cur,d=(c.docs||[]).find(x=>x.id===id);if(!d)return;
 confirmBox(`Eliminare il documento "${d.nome}"?`,async()=>{c.docs=c.docs.filter(x=>x.id!==id);markDirty(c);rerenderTab();for(let i=0;i<d.n;i++)await store.delChunk(d.id+'_'+i).catch(()=>{});toast('Documento eliminato')})}
let pdfjsP=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)})}
function pdfLib(){if(!pdfjsP)pdfjsP=(async()=>{const B='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';await loadScript(B+'pdf.min.js');await loadScript(B+'pdf.worker.min.js');const L=window.pdfjsLib;L.GlobalWorkerOptions.workerSrc=B+'pdf.worker.min.js';return L})().catch(e=>{pdfjsP=null;throw e});return pdfjsP}
async function pdfToImages(blob,max){
 const L=await pdfLib();const pdf=await L.getDocument({data:new Uint8Array(await blob.arrayBuffer()),isEvalSupported:false}).promise;const out=[];
 for(let p=1;p<=Math.min(max,pdf.numPages);p++){const page=await pdf.getPage(p);const v1=page.getViewport({scale:1});const vp=page.getViewport({scale:Math.min(2.2,1700/v1.width)});
  const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;out.push(await new Promise(r=>cv.toBlob(r,'image/jpeg',0.88)))}
 return out}
async function docExtract(id){
 const c=S.cur,d=(c.docs||[]).find(x=>x.id===id);if(!d||!SAMPLE)return;
 $('#modal').innerHTML=`<div class="modal"><div class="card gold vb"><h2>Estrai <em>dati</em></h2><p class="note" style="margin:6px 0">${esc(d.nome)}</p><div class="err" id="err"></div><div id="vres"><p class="note">Preparo il documento…</p></div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost" data-a="vclose">Chiudi</button></div></div></div>`;
 let imgs;
 try{const lim=await SAMPLE.limits().catch(()=>null);if(!lim||!lim.images)throw{code:'images_unavailable'};
  const blob=await docBlob(d);imgs=d.tipo==='application/pdf'?await pdfToImages(blob,Math.min(4,lim.images.maxCount||4)):[blob]}
 catch(e){$('#vres').innerHTML='';$('#err').textContent=e&&e.code==='images_unavailable'?'Lettura dei documenti non disponibile in questa vista.':(d.tipo==='application/pdf'?'Non riesco a leggere questo PDF qui: carica una foto o uno screenshot della pagina e usa Estrai dati su quello.':'Documento non leggibile.');return}
 $('#vres').innerHTML=`<p class="note">Claude sta leggendo il documento… <button class="btn sm ghost" id="vstop">Annulla</button></p>`;
 voiceCtl=new AbortController();$('#vstop').onclick=()=>voiceCtl&&voiceCtl.abort();
 try{const out=await SAMPLE.json(extractPrompt(`Le immagini allegate sono ${imgs.length>1?'le pagine':'la pagina'} del documento "${d.nome}" (es. polizza, quietanza, estratto conto, visura, documento d'identità) relativo a questo cliente.`,'scritto chiaramente nel documento'),{images:imgs,signal:voiceCtl.signal});
  voiceCtl=null;if(!$('#vres'))return;
  voicePending=parseExtract(out,`Dati estratti dal documento "${d.nome}"`,'Annota nel diario la provenienza dei dati');showVoicePreview()}
 catch(e){voiceCtl=null;if(!$('#vres'))return;$('#vres').innerHTML='';$('#err').textContent=e&&e.code==='cancelled'?'':e&&e.code==='rate_limited'?'Limite di utilizzo raggiunto: riprova più tardi.':'Lettura non riuscita, riprova.'}
}

function disclaimer(){return`Elaborato a titolo esemplificativo, con dati riferiti al ${todayIT()}. Ogni elemento va verificato con la documentazione di sintesi bancaria, finanziaria e assicurativa e con la normativa fiscale e legale vigente. Dati, percentuali e performance non garantiscono risultati futuri; i rendimenti passati non sono indicativi di quelli futuri.`}
function fval(f,v){const[,l,t]=f;if(v===''||v==null||v==='—')return'';if(t==='bool')return v?'Sì':'No';if(t==='date')return fmtD(v);if(t==='num')return/\(€\)/.test(l)?eur(num(v)):String(v);return String(v)}
function tableHTML(key){const list=S.cur[key]||[];if(!list.length)return'';const fs=F[key].filter(f=>f[0]!=='note'||key==='note');
 return`<h3>${ARR_TITLES[key]}</h3><table><tr>${fs.map(f=>`<th>${esc(f[1])}</th>`).join('')}</tr>${list.map(r=>`<tr>${fs.map(f=>`<td>${esc(fval(f,r[f[0]]))}</td>`).join('')}</tr>`).join('')}</table>`}
function kv(fields,obj){const r=fields.map(f=>[f[1],fval(f,obj[f[0]])]).filter(x=>x[1]);return r.length?`<table class="kv">${r.map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</table>`:''}
function scaricaScheda(){
 flush();const c=S.cur,A=analizza(c);const sel=A.O.filter(o=>(c.prop||{})[o.k]);const ops=sel.length?sel:A.O;
 const html=`<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><title>Scheda di sintesi – ${esc(fullName(c))}</title><style>

 .kv th{width:38%}.box{display:flex;flex-wrap:wrap;gap:8px}.box div{border:1px solid #C9A26B;border-radius:8px;padding:7px 10px;min-width:150px}.box b{display:block;font:600 16px Georgia,serif;color:#7d0c1e}
 .head{border-left:6px solid #7d0c1e;padding-left:12px}.disc{font-size:11px;color:#666;border-top:1px solid #ccc;margin-top:30px;padding-top:10px}
 @media print{body{margin:0}}</style></head><body>
 <div class="head"><div style="font-size:11px;letter-spacing:.15em;color:#9a7440;text-transform:uppercase">Scheda di sintesi riservata</div><h1>${esc(fullName(c))}</h1><div>Aggiornata al ${todayIT()} · ${esc(FIRMA)}</div></div>
 <h2>Anagrafica e profilo</h2>${kv(F.anag.filter(f=>!['nome','cognome'].includes(f[0])),c)}${tableHTML('fam')}${tableHTML('int')}${tableHTML('ric')}
 <h2>Lavoro, redditi e aziende</h2>${kv(F.lav,c)}${tableHTML('az')}
 <h2>Patrimonio</h2><div class="box"><div><b>${eur(A.totAtt)}</b>Attività</div><div><b>${eur(A.totPas)}</b>Passività</div><div><b>${eur(A.netto)}</b>Patrimonio netto</div><div><b>${eur(A.fin)}</b>Finanziario</div></div>${tableHTML('att')}${tableHTML('pas')}${tableHTML('ban')}
 <h2>Coperture assicurative</h2>${tableHTML('cop')||'<p>Nessuna copertura censita.</p>'}
 <div class="box"><div><b>${eur(A.fabb)}</b>Fabbisogno caso morte</div><div><b>${eur(A.tcmEs)}</b>Già assicurato</div><div><b>${eur(A.gap)}</b>Scopertura</div></div>
 <p style="font-size:11.5px;color:#666">Fabbisogno = debiti residui + reddito netto annuo × ${A.anni} anni − capitali caso morte e CPI in essere.</p>
 <h2>Aree di intervento ${sel.length?'proposte':'rilevate'}</h2>${ops.length?'<ul>'+ops.map(o=>`<li><b>${esc(o.t)}</b> – ${esc(o.d)}</li>`).join('')+'</ul>':'<p>Nessuna area rilevata.</p>'}
 ${c.propNote?`<h3>Note</h3><p>${esc(c.propNote).replace(/\n/g,'<br>')}</p>`:''}
 <p class="disc">${esc(disclaimer())}<br><br>${esc(FIRMA)}</p></body></html>`;
 const fn='Scheda_'+(fullName(c).replace(/[^\wÀ-ÿ]+/g,'_'))+'_'+today()+'.html';
 if(store.dl||!window.claude){saveFile(fn,html).then(()=>toast('Scheda salvata'),()=>toast('Download annullato'));return}
 navigator.clipboard.writeText(testoScheda()).then(()=>toast('Download non disponibile: testo copiato'),()=>toast('Download non disponibile in questa vista'));
}

}
